name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: Publish Binaries

    runs-on: windows-latest

    permissions:
      contents: write
      actions: read

    steps:
      - name: ✅ Checkout Repository ✅
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: 🛠️ Download Rust Tools 🛠️
        uses: OpenDevicePartnership/patina-devops/.github/actions/rust-tool-cache@37902f7991125091a91ca4054395d2d65576a7f5 # v0.3.16

      - name: Setup artifacts directories
        run: |
          mkdir -p artifacts/debug
          mkdir -p artifacts/release
          mkdir -p artifacts/debug/debugger

      - name: Build MSVM X64 Debug
        run: |
          cargo make msvm-x64
          cp target/x86_64-unknown-uefi/debug/msvm_x64_dxe_core.efi artifacts/debug/msvm_x64_dxe_core.efi
          cp target/x86_64-unknown-uefi/debug/msvm_x64_dxe_core.pdb artifacts/debug/msvm_x64_dxe_core.pdb

      - name: Build MSVM AARCH64 Debug
        run: |
          cargo make msvm-aarch64
          cp target/aarch64-unknown-uefi/debug/msvm_aarch64_dxe_core.efi artifacts/debug/msvm_aarch64_dxe_core.efi
          cp target/aarch64-unknown-uefi/debug/msvm_aarch64_dxe_core.pdb artifacts/debug/msvm_aarch64_dxe_core.pdb

      - name: Build MSVM X64 Release
        run: |
          cargo make msvm-x64-release
          cp target/x86_64-unknown-uefi/release/msvm_x64_dxe_core.efi artifacts/release/msvm_x64_dxe_core.efi
          cp target/x86_64-unknown-uefi/release/msvm_x64_dxe_core.pdb artifacts/release/msvm_x64_dxe_core.pdb

      - name: Build MSVM AARCH64 Release
        run: |
          cargo make msvm-aarch64-release
          cp target/aarch64-unknown-uefi/release/msvm_aarch64_dxe_core.efi artifacts/release/msvm_aarch64_dxe_core.efi
          cp target/aarch64-unknown-uefi/release/msvm_aarch64_dxe_core.pdb artifacts/release/msvm_aarch64_dxe_core.pdb

      - name: Build MSVM X64 Debug (Debugger)
        run: |
          cargo make msvm-x64 --features enable_debugger
          cp target/x86_64-unknown-uefi/debug/msvm_x64_dxe_core.efi artifacts/debug/debugger/msvm_x64_dxe_core.efi
          cp target/x86_64-unknown-uefi/debug/msvm_x64_dxe_core.pdb artifacts/debug/debugger/msvm_x64_dxe_core.pdb

      - name: Build MSVM AARCH64 Debug (Debugger)
        run: |
          cargo make msvm-aarch64 --features enable_debugger
          cp target/aarch64-unknown-uefi/debug/msvm_aarch64_dxe_core.efi artifacts/debug/debugger/msvm_aarch64_dxe_core.efi
          cp target/aarch64-unknown-uefi/debug/msvm_aarch64_dxe_core.pdb artifacts/debug/debugger/msvm_aarch64_dxe_core.pdb

      - name: Upload Binaries
        if: ${{ github.event_name != 'release' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msvm-dxe-core
          path: artifacts/

      - name: Publish Release Asset
        if: ${{ github.event_name == 'release' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Compress-Archive -Path artifacts/* -DestinationPath patina_dxe_core_msvm.zip
          gh release upload ${{ github.event.release.tag_name }} patina_dxe_core_msvm.zip
