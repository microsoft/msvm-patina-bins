version: "0.2"
language: en
dictionaries:
  - "rust"
ignorePaths:
  - "**/target/**"
  - "**/book/**"
  - "**/contributors.md"
  - "docs/mermaid.min.js"
ignoreRegExpList: ["/0x[0-9a-fA-F]+/", ".*asm!\\([\\s\\S]*?\\);"]
minWordLength: 4
caseSensitive: false
allowCompoundWords: true
words:
  - apic
  - asan
  - cfgs
  - cpuid
  - dxecore
  - efiapi
  - efer
  - gicd
  - gicr
  - keccak
  - lidt
  - lvmcall
  - mdbook
  - micr
  - mmio
  - msvc
  - msvm
  - msrs
  - mtrrcap
  - nocapture
  - osof
  - pdbaltpath
  - pemfile
  - psci
  - rdmsr
  - rdtsc
  - regs
  - rustls
  - sysregs
  - tdcall
  - tdvmcall
  - uart
  - uefi
  - ungated
  - vmcall
  - vswhere
  - webpki
  - wrmsr
  - zbuild
  - zsanitizer
