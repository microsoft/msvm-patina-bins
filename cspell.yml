version: "0.2"
language: en
dictionaries:
  - "rust"
ignorePaths:
  - "**/target/**"
  - "**/book/**"
  - "**/contributors.md"
  - "docs/mermaid.min.js"
ignoreRegExpList: ["/0x[0-9a-fA-F]+/", ".*asm!\\([\\s\\S]*?\\);"]
minWordLength: 4
caseSensitive: false
allowCompoundWords: true
words:
  - asan
  - cfgs
  - dxecore
  - efiapi
  - gicd
  - gicr
  - keccak
  - mdbook
  - msvc
  - msvm
  - nocapture
  - pdbaltpath
  - pemfile
  - rustls
  - sysregs
  - uart
  - uefi
  - ungated
  - vswhere
  - webpki
  - zbuild
  - zsanitizer
